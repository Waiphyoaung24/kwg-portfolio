services:
  desktop:
    build: .
    image: kwg-mt5-desktop:qualification
    container_name: kwg-mt5-desktop
    restart: unless-stopped
    init: true
    tty: true
    # Display sockets and locks must not survive container restarts.
    tmpfs:
      - /tmp:mode=1777,size=256m
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      MT5_DEMO_LOGIN: ${MT5_DEMO_LOGIN:-}
    ports:
      - "127.0.0.1:6081:6080"
    volumes:
      - mt5-home:/home/mt5
      - status-snapshot:/opt/status
    logging:
      options:
        max-size: 2m
        max-file: "2"
  status:
    image: python:3.12-alpine
    container_name: kwg-trading-status
    profiles: [status]
    command: ["python", "/app/status_server.py"]
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./status_server.py:/app/status_server.py:ro
      - status-snapshot:/status:ro
    networks:
      - dokploy-network
volumes:
  mt5-home:
  status-snapshot:
networks:
  dokploy-network:
    external: true
