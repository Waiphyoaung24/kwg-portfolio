# Runs the app + its Postgres together. Dokploy reads this file (compose.yml wins over docker-compose.yml).
# Postgres data persists in the `pgdata` volume — no manual DB setup needed.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kwg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kwg}
      POSTGRES_DB: kwg
    # Loopback-only host port so local `npm run dev` can reach the DB.
    # In prod the app container still connects over the compose network (db:5432).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kwg -d kwg"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kwg:${POSTGRES_PASSWORD:-kwg}@db:5432/kwg
      # Vault tool links, read at request time by /vault (empty → localhost fallback)
      PUBLIC_MEMOS_URL: ${PUBLIC_MEMOS_URL:-}
      PUBLIC_OPENGYM_URL: ${PUBLIC_OPENGYM_URL:-}
      PUBLIC_FIGCRAFT_URL: ${PUBLIC_FIGCRAFT_URL:-}
      # Vault Finance sign-in: output of `node scripts/finance-password-hash.mjs`.
      # Unset → finance refuses every sign-in with a setup message.
      FINANCE_PASSWORD_HASH: ${FINANCE_PASSWORD_HASH:-}
      FINANCE_TZ: ${FINANCE_TZ:-Asia/Bangkok}
    ports:
      - "3069:3000"

  # ── openGym — Fitness (upstream UI, same-origin web/API for passkeys) ──
  opengym-api:
    image: ghcr.io/duartesantos8/opengym-api:1.4.1
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      RP_ID: ${OPENGYM_RP_ID:-localhost}
      ORIGIN: ${PUBLIC_OPENGYM_URL:-http://localhost:8091}
      TRUST_PROXY: "1"
      FIRST_USER_ADMIN: "1"
      ALLOW_GUEST: "0"
    volumes:
      - opengym_data:/data

  opengym:
    image: ghcr.io/duartesantos8/opengym-web:1.4.1
    restart: unless-stopped
    depends_on:
      - opengym-api
    environment:
      NGINX_PORT: "80"
      BACKEND: opengym-api
      PORT: "3000"
      RESOLVER: "127.0.0.11"
      BASE_PATH: ""
      CF_CONNECTING_IP: ""
      MEDIA_UPLOAD_MAX: 48m
    ports:
      - "${BIND_HOST:-127.0.0.1}:8091:80"

  # ── FigCraft — published browser build, no collaboration server ───────
  figcraft:
    build: ./ops/figcraft
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:8092:80"

  # ── Memos — note-taking (Vault → Notes) ──────────────────────────────
  # Single-user, so SQLite (default) in a volume — no DB container needed.
  memos:
    # ponytail: `stable` still floats — pin to an exact tag (neosmemo/memos:X.Y.Z)
    # from https://hub.docker.com/r/neosmemo/memos/tags before you rely on prod.
    image: neosmemo/memos:stable
    restart: unless-stopped
    # Bind host: loopback for local dev; set BIND_HOST=172.17.0.1 in prod so ONLY the
    # Cloudflare tunnel (via the docker bridge) can reach it — not the public/LAN interface.
    ports:
      - "${BIND_HOST:-127.0.0.1}:5230:5230"
    volumes:
      - memos_data:/var/opt/memos

volumes:
  pgdata:
  opengym_data:
  memos_data:
