surface: /vault/dashboard
visual_authority: Dashboard exception in ../DESIGN.md; src/styles.css theme; shared/tokens.css geometry
mode: daisyUI kwg dark theme only; goal-first Today and Founder; six note page layouts and Settings
source_contract: Reuses Dot geometry, component states, keyboard controls, reduced motion, and graph behavior
data:
  storage: User-selected local directories only; no notes network endpoint
  permissions: Explicit Choose folder or Reconnect click only; never automatic prompts
  workspaces: personal and parallel; reject same or overlapping roots
  browser_memory: Directory handles in IndexedDB only, never note contents
  save: Explicit; content-hash conflict check; browser write lock; previous content in local .history
  limits: Six flat folders; existing safe Markdown filenames; 1 MiB per note
  errors: Unsupported browser, dismissed picker, denied/revoked permission, missing folder, conflict, write failure
  navigation: /vault/dashboard with page and workspace query parameters
  privacy: No seed notes, secrets, server credentials, remote migration, telemetry or note uploads
acceptance:
  - Isolated Personal and Parallel roots, tabs and saves
  - Cancelled switch preserves draft; saving blocks workspace change
  - Reconnect permission preserves the active draft and original version without a discard prompt
  - Safe initial no-folder screen; no silent browser-storage fallback
  - Six note pages, nine Wai-G and five goal templates, graph and keyboard list
  - Today and Founder show milestone steps and goal stats from a founder goals note; Personal offers goal setup, Parallel shows nothing without its own note
  - Founder shows lead pipeline, niche validation and conversation count from typed frontmatter
  - Settings tab owns folder selection; disconnected note pages link to Settings
  - Back to vault is the first sidebar control
  - Centered desktop content beside the rail; compact connection and editor empty states
  - Tablet and phone Pages disclosure supports touch, keyboard and Escape
  - Visible focus; readable neutral contrast; mobile no overflow

operate_type: App headings (h1 32, h2 20, h3 20 pixels) at weight 600; body 400; daisyUI actions 600; system sans; sentence-case labels
selected_navigation: daisyUI menu-active with aria-current; content colors always paired with their background role
components: daisyUI 5 classes on plain elements; native dialog; custom keyboard workspace menu
theme_boundary: html[data-theme=kwg] owns semantic variables; no marketing SCSS import
